name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sonar:
    # The gate reads the profile each OS job uploaded, so it waits for them, and
    # still runs when one failed so the scan is not lost.
    needs: test
    # Pull requests from forks get no secrets, so the scanner could not authenticate.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: profiles
          merge-multiple: true
      - name: Merge Go coverage from every OS
        run: |
          go test ./.github/covermerge
          go run ./.github/covermerge profiles/*.out > coverage.out
      - run: npm ci --ignore-scripts --prefix web
      - name: Web coverage
        id: web_coverage
        # The 100% gate is enforced after the scan, so Sonar always gets the data.
        continue-on-error: true
        run: npm run coverage --prefix web
      # Runs that Dependabot triggers get no repository secrets, so the scanner cannot
      # authenticate and fails whatever the change. Those runs skip the analysis and say so.
      # main's own run after the merge has the token, so the gate on main still decides.
      # The coverage gate below runs either way.
      - name: Is the Sonar token available?
        id: sonar_token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error title=Sonar token missing::main's run must have SONAR_TOKEN; the analysis cannot be skipped here."
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sonar skipped::SONAR_TOKEN is not available to this run (Dependabot gets no repository secrets), so the SonarCloud analysis was skipped. main's analysis after the merge still runs."
          fi
      - name: SonarCloud Scan
        if: ${{ steps.sonar_token.outputs.present == 'true' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarCloud Quality Gate
        if: ${{ steps.sonar_token.outputs.present == 'true' }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Coverage must be 100%
        if: ${{ !cancelled() }}
        env:
          WEB_COVERAGE: ${{ steps.web_coverage.outcome }}
        run: |
          test "$WEB_COVERAGE" = success
          make cov-check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix web
      - run: npm audit --audit-level=moderate --prefix web
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go-only builds report the missing console and source state
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build ./...
          binary="$RUNNER_TEMP/iris-version.exe"
          go build -trimpath -o "$binary" ./cmd/iris
          test "$("$binary" version)" = "dev (commit $GITHUB_SHA; source clean; console missing)"
          trap 'rm -f .iris-build-identity-probe' EXIT
          echo dirty > .iris-build-identity-probe
          go build -trimpath -o "$binary" ./cmd/iris
          test "$("$binary" --version)" = "dev (commit $GITHUB_SHA; source dirty; console missing)"
          rm .iris-build-identity-probe
          go build -buildvcs=false -trimpath -o "$binary" ./cmd/iris
          test "$("$binary" version)" = "dev (commit unknown; source modified unknown; console missing)"
      - run: go vet ./...
      # Includes the package-discovery regression with a Go package under
      # node_modules; it runs on every OS without needing npm or Node.
      - run: go test -coverprofile=coverage-${{ matrix.os }}.out ./...
        # PowerShell would split the flag at the dot in its value.
        shell: bash
        env:
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.out
          retention-days: 1
      - run: go test -race -timeout=30m ./...
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
      # The sonar job's gate credits a statement covered on any system. This one holds each system
      # to its own profile, which is what `make cov-check` reports on a machine of that system.
      - name: Every statement this system builds is covered
        run: go run ./.github/covermerge -check coverage-${{ matrix.os }}.out
        shell: bash
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath ./cmd/iris
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}

  hook-latency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Measure 100 real pre-edit hooks (report only, no latency threshold)
        run: go test ./cmd/iris -run '^TestHookLatency$' -count=1 -v
        env:
          CGO_ENABLED: "0"
          IRIS_MEASURE_LATENCY: "1"
      # Fails if a shell reconcile against a hub 80 ms away runs out of its budget (D3).
      - name: Run real shell hooks against a delayed remote hub and a loopback one
        run: go test ./cmd/iris -run '^TestShellReconcileLatency$' -count=1 -v
        env:
          CGO_ENABLED: "0"
          IRIS_MEASURE_LATENCY: "1"
  release-image:
    # The image has no shell, so only a real run shows the hub can write to /data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # The release workflow builds the console in a job of its own and hands it over as
      # WEB_DIST. Build it the local way here, then give the snapshot the same hand-over,
      # so both branches of `make web` run before the first tag.
      - name: Local build rebuilds the console without source dirt
        shell: bash
        run: |
          set -euo pipefail
          make build
          test "$(./iris version)" = "dev (commit $GITHUB_SHA; source clean; console unverified)"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$RUNNER_TEMP/webui-dist"
          cp -a internal/webui/dist/. "$RUNNER_TEMP/webui-dist/"
          # Vite's output is deterministic, so mark the copy: only the copy branch of
          # `make web` can then produce what the last step compares.
          printf '\n<!-- handed over by CI -->\n' >> "$RUNNER_TEMP/webui-dist/index.html"
      # Keyless signing needs a release's OIDC identity, so only the SBOM is exercised here.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --snapshot --clean --skip=sign
        env:
          WEB_DIST: ${{ runner.temp }}/webui-dist
      - name: The snapshot embedded the handed-over console
        shell: bash
        run: |
          set -euo pipefail
          cmp internal/webui/dist/index.html "$RUNNER_TEMP/webui-dist/index.html"
          grep -q 'handed over by CI' internal/webui/dist/index.html
      - name: The snapshot made an SBOM for every archive
        shell: bash
        run: |
          set -euo pipefail
          archives=$(ls dist/*.tar.gz dist/*.zip | wc -l)
          sboms=$(ls dist/*.sbom.json | wc -l)
          echo "archives=$archives sboms=$sboms"
          test "$archives" -gt 0
          test "$archives" = "$sboms"
      - name: The release workflow confines signing and verifies its Windows handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from copy import deepcopy
          import re
          import yaml

          pins = {
              "actions/checkout": "3d3c42e5aac5ba805825da76410c181273ba90b1",
              "actions/setup-node": "949feb2413d6458794dcd2491c4babbbce0c15c1",
              "actions/setup-go": "40f1582b2485089dde7abd97c1529aa768e1baff",
              "actions/upload-artifact": "ea165f8d65b6e75b540449e92b4886f43607fa02",
              "actions/download-artifact": "9000827ccba6bdab643e8b6fd33ac0654aef8333",
              "sigstore/cosign-installer": "756fe2d284c7292c4e9b62c8a28f1e5629c59532",
              "anchore/sbom-action/download-syft": "66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c",
              "goreleaser/goreleaser-action": "a4f02ab5355a589de60d917a659ce617ed19b3de",
              "actions/attest-build-provenance": "4d101475d8b20a2381f78447822ac1eab6504dd8",
          }
          def expression(value):
              return "$" + "{{ " + value + " }}"

          hook = '{{ if and (eq .Os "windows") (not .IsSnapshot) }}"{{ .Env.IRIS_RELEASE_HELPER }}" sign-windows --arch={{ .Arch }} --path="{{ .Path }}"{{ end }}'
          secret_names = ["GITHUB_TOKEN", "CERTUM_EMAIL", "CERTUM_OTP", "MACOS_SIGN_P12", "MACOS_SIGN_PASSWORD", "MACOS_NOTARY_ISSUER_ID", "MACOS_NOTARY_KEY_ID", "MACOS_NOTARY_KEY"]
          def check(release, config, proof):
              assert release[True] == {"push": {"tags": ["v[0-9]+.[0-9]+.[0-9]+*"]}}
              assert release["permissions"] == {"contents": "read"}
              assert release["concurrency"] == {"group": "certum-signing", "cancel-in-progress": False}
              assert config["release"]["draft"] is True
              assert config["builds"][0]["hooks"] == {"post": [{"cmd": hook}]}
              jobs = release["jobs"]
              assert set(jobs) == {"web", "signer", "release", "verify-windows"}
              assert jobs["release"]["needs"] == ["web", "signer"]
              assert jobs["verify-windows"]["needs"] == "release"
              outside_signing = deepcopy(release)
              for name, job in jobs.items():
                  assert job["if"] == "github.repository == 'mateusz-klatt/iris'"
                  assert job["runs-on"] == ("windows-latest" if name == "verify-windows" else "ubuntu-latest")
                  assert job["permissions"] == ({"contents": "write", "id-token": "write", "attestations": "write"} if name == "release" else {"contents": "read"})
                  for step in job["steps"]:
                      if "uses" in step:
                          action, revision = step["uses"].split("@")
                          assert revision == pins[action]
                      if step.get("uses", "").startswith("actions/checkout@"):
                          assert step["with"]["persist-credentials"] is False
              signing = [s for s in jobs["release"]["steps"] if s.get("name") == "Build and sign the draft release"]
              assert len(signing) == 1
              assert signing[0]["run"] == "goreleaser release --clean --parallelism=1"
              for name in secret_names:
                  assert signing[0]["env"][name] == expression("secrets." + name)
              assert set(signing[0]["env"]) == set(secret_names + ["WEB_DIST", "IRIS_RELEASE_HELPER", "IRIS_WINDOWS_SIGNER", "XDG_RUNTIME_DIR"])
              helper = [s for s in jobs["release"]["steps"] if s.get("id") == "helper"][0]
              assert helper["env"] == {"CGO_ENABLED": "0"}
              assert helper["run"].splitlines() == ['go build -trimpath -o "$RUNNER_TEMP/iris-release-tools" ./cmd/iris-release-tools', 'echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"']
              for step in outside_signing["jobs"]["release"]["steps"]:
                  if step.get("name") == "Build and sign the draft release":
                      step.pop("env")
              assert "secrets" not in yaml.safe_dump(outside_signing).casefold()
              assert not re.search(r"^\s*(environment|continue-on-error):", yaml.safe_dump(release), re.M)
              assert "always()" not in yaml.safe_dump(release)
              signer = jobs["signer"]["steps"]
              assert signer[0]["with"]["repository"] == "Le-Syl21/ssign"
              assert signer[0]["with"]["ref"] == "f7ba7b2360a3e40bb8aa062d244d95c62a743b90"
              assert signer[1]["run"].splitlines() == ["rustup toolchain install 1.99.1 --profile minimal", "cargo +1.99.1 build --release --locked", 'sha256sum target/release/ssign >> "$GITHUB_STEP_SUMMARY"']
              installs = [s for s in jobs["release"]["steps"] if s.get("uses", "").startswith("goreleaser/")]
              assert installs[0]["with"] == {"version": "v2.20.0", "install-only": True}
              for name in ["web", "signer", "release"]:
                  job = jobs[name]
                  assert job["outputs"] == {"artifact-id": expression("steps.upload.outputs.artifact-id")}
                  upload = [s for s in job["steps"] if s.get("id") == "upload"][0]
                  assert upload["with"]["name"].endswith(expression("github.run_id") + "-" + expression("github.run_attempt"))
                  assert upload["with"]["retention-days"] == 1
                  assert upload["with"]["if-no-files-found"] == "error"
              assert jobs["web"]["steps"][-1]["with"]["path"] == "internal/webui/dist"
              assert signer[-1]["with"]["path"] == "ssign/target/release/ssign"
              version = expression("steps.helper.outputs.version")
              assert jobs["release"]["steps"][-1]["with"]["path"].splitlines() == [f"dist/iris_{version}_windows_amd64.zip", f"dist/iris_{version}_windows_arm64.zip", "dist/checksums.txt"]
              downloads = [s["with"] for s in jobs["release"]["steps"] if s.get("uses", "").startswith("actions/download-artifact@")]
              assert downloads == [{"artifact-ids": expression("needs.web.outputs.artifact-id"), "path": expression("runner.temp") + "/webui-dist"}, {"artifact-ids": expression("needs.signer.outputs.artifact-id"), "path": expression("runner.temp") + "/signer"}]
              verify = jobs["verify-windows"]
              assert verify["env"]["EXPECTED_SIGNER_THUMBPRINT"] == proof["jobs"]["verify"]["env"]["EXPECTED_SIGNER_THUMBPRINT"] == "9C837C68415187A72D88612BDF14FCB0D6623D67"
              assert verify["steps"][0]["with"]["ref"] == expression("github.sha")
              assert verify["steps"][2]["with"] == {"artifact-ids": expression("needs.release.outputs.artifact-id"), "path": expression("runner.temp") + "/windows-handoff"}
              archive_check = verify["steps"][3]["run"]
              assert 'verify-windows-archives "--version=$version" "--dir=$env:RUNNER_TEMP/windows-handoff" "--out=$env:RUNNER_TEMP/windows-verified"' in archive_check
              assert "GITHUB_STEP_SUMMARY" in archive_check
              native = verify["steps"][4]["run"]
              for policy in ["foreach ($arch in 'amd64', 'arm64')", "windows-verified/$arch/iris.exe", "& $signtool verify /pa /all /v /tw $file", 'if ($LASTEXITCODE -ne 0) { throw', "$signature.Status -ne 'Valid'", "$null -eq $signature.TimeStamperCertificate", "$signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER_THUMBPRINT", "GITHUB_STEP_SUMMARY"]:
                  assert policy in native, policy

          release = yaml.safe_load(open(".github/workflows/release.yml"))
          config = yaml.safe_load(open(".goreleaser.yaml"))
          proof = yaml.safe_load(open(".github/workflows/signing-proof.yml"))
          check(release, config, proof)
          mutations = [
              ((True,), {"workflow_dispatch": None}),
              (("concurrency", "group"), "other"),
              (("concurrency", "cancel-in-progress"), True),
              (("permissions",), {"contents": "write"}),
              (("environment",), "signing"),
              (("env",), {"LEAK": expression("secrets.CERTUM_OTP")}),
              (("jobs", "web", "if"), "always()"),
              (("jobs", "signer", "if"), "always()"),
              (("jobs", "release", "if"), "always()"),
              (("jobs", "verify-windows", "if"), "always()"),
              (("jobs", "web", "permissions"), {"contents": "write"}),
              (("jobs", "verify-windows", "permissions"), {"contents": "write"}),
              (("jobs", "release", "continue-on-error"), True),
              (("jobs", "release", "env"), {"LEAK": expression("toJSON(secrets)")}),
              (("jobs", "signer", "steps", 0, "with", "ref"), "main"),
              (("jobs", "signer", "steps", 1, "run"), "cargo +stable build --release"),
              (("jobs", "release", "needs"), ["web"]),
              (("jobs", "verify-windows", "needs"), "signer"),
              (("jobs", "release", "steps", 0, "uses"), "actions/checkout@main"),
              (("jobs", "release", "steps", 1, "with", "artifact-ids"), "1,2"),
              (("jobs", "release", "steps", -1, "with", "path"), "dist/*"),
              (("jobs", "verify-windows", "env", "EXPECTED_SIGNER_THUMBPRINT"), "OTHER"),
              (("jobs", "verify-windows", "steps", -1, "run"), "& $signtool verify /pa $file"),
          ]
          signing_index = next(i for i, s in enumerate(release["jobs"]["release"]["steps"]) if s.get("name") == "Build and sign the draft release")
          mutations += [(("jobs", "release", "steps", signing_index, "run"), "goreleaser release --clean")]
          for original, replacement in [("/pa /all /v /tw", "/pa /all /v"), ("$LASTEXITCODE -ne 0", "$LASTEXITCODE -eq 1"), ("$null -eq $signature.TimeStamperCertificate", "$false"), ("$signature.Status -ne 'Valid'", "$false"), ("$signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER_THUMBPRINT", "$false")]:
              mutations.append((("jobs", "verify-windows", "steps", -1, "run"), release["jobs"]["verify-windows"]["steps"][-1]["run"].replace(original, replacement)))
          for path, value in mutations:
              mutated = deepcopy(release)
              target = mutated
              for key in path[:-1]:
                  target = target[key]
              target[path[-1]] = value
              try:
                  check(mutated, config, proof)
              except (AssertionError, KeyError):
                  pass
              else:
                  raise AssertionError(f"Release guard accepted mutation at {path}")
          for path, value in [(("release", "draft"), False), (("builds", 0, "hooks", "post", 0, "cmd"), hook.replace("(not .IsSnapshot)", "true"))]:
              mutated = deepcopy(config)
              target = mutated
              for key in path[:-1]:
                  target = target[key]
              target[path[-1]] = value
              try:
                  check(release, mutated, proof)
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"Release guard accepted config mutation at {path}")
          print(f"release.yml: real workflow and config passed; all {len(mutations) + 2} mutations rejected")
          PY
      - name: The signing proof is manual and confines Certum secrets to sign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from copy import deepcopy
          import yaml

          def check(proof):
              assert list(proof[True]) == ["workflow_dispatch"], proof[True]
              outside_sign = deepcopy(proof)
              sign = outside_sign["jobs"].pop("sign")
              dumped = yaml.safe_dump(outside_sign)
              assert "CERTUM_" not in dumped, "Certum credentials outside sign"
              assert "secrets" not in dumped.casefold(), "Secrets outside sign"
              signing = [step for step in sign["steps"] if step.get("name") == "Sign each binary once"]
              assert len(signing) == 1, "Expected one signing step"
              assert signing[0]["env"] == {
                  "CERTUM_EMAIL": "$" + "{{ secrets.CERTUM_EMAIL }}",
                  "CERTUM_OTP": "$" + "{{ secrets.CERTUM_OTP }}",
                  "IRIS_WINDOWS_SIGNER": "$" + "{{ runner.temp }}/signer/ssign",
                  "XDG_RUNTIME_DIR": "$" + "{{ runner.temp }}/certum-signing",
              }, "Expected only the signing step credentials and paths"
              assert signing[0]["run"].splitlines() == [
                  '"$RUNNER_TEMP/iris-release-tools" sign-windows --arch=amd64 --path="$RUNNER_TEMP/windows/amd64/iris.exe"',
                  '"$RUNNER_TEMP/iris-release-tools" sign-windows --arch=arm64 --path="$RUNNER_TEMP/windows/arm64/iris.exe"',
              ], "Expected two separate helper processes"
              assert any(step.get("run") == 'go build -trimpath -o "$RUNNER_TEMP/iris-release-tools" ./cmd/iris-release-tools' and step.get("env") == {"CGO_ENABLED": "0"} for step in sign["steps"]), "Expected a native helper build"
              signing[0].pop("env", None)
              assert "secrets" not in yaml.safe_dump(sign).casefold(), "Secrets outside signing step env"

          proof = yaml.safe_load(open(".github/workflows/signing-proof.yml"))
          check(proof)
          for path, reference in [
              (("jobs", "verify", "env"), "secrets.certum_otp"),
              (("jobs", "signer", "env"), "secrets[format('certum_{0}', 'otp')]"),
              (("jobs", "verify", "env"), "toJSON(secrets)"),
              (("env",), "secrets.certum_otp"),
              (("jobs", "sign", "env"), "secrets.CERTUM_OTP"),
              (("jobs", "sign", "steps", 0, "env"), "secrets.CERTUM_OTP"),
          ]:
              mutated = deepcopy(proof)
              target = mutated
              for key in path[:-1]:
                  target = target[key]
              target[path[-1]] = {"LEAK": "$" + "{{ " + reference + " }}"}
              try:
                  check(mutated)
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"Guard accepted secret reference at {path}")
          print("signing-proof.yml: real workflow passed; all six secret-scope mutations rejected")
          mutated = deepcopy(proof)
          step = next(s for s in mutated["jobs"]["sign"]["steps"] if s.get("name") == "Sign each binary once")
          step["run"] = '"$RUNNER_TEMP/signer/ssign" "$RUNNER_TEMP/windows/amd64/iris.exe" "$RUNNER_TEMP/windows/arm64/iris.exe"'
          try:
              check(mutated)
          except AssertionError:
              pass
          else:
              raise AssertionError("Proof guard accepted direct signing in one process")
          print("signing-proof.yml: direct-signing mutation rejected")
          mutated = deepcopy(proof)
          helper = next(s for s in mutated["jobs"]["sign"]["steps"] if s.get("name") == "Build the release helper")
          helper["run"] = "echo helper omitted"
          try:
              check(mutated)
          except AssertionError:
              pass
          else:
              raise AssertionError("Proof guard accepted a missing helper build")
          print("signing-proof.yml: missing-helper-build mutation rejected")
          mutated = deepcopy(proof)
          step = next(s for s in mutated["jobs"]["sign"]["steps"] if s.get("name") == "Sign each binary once")
          step["env"]["LEAK"] = "$" + "{{ toJSON(secrets) }}"
          try:
              check(mutated)
          except AssertionError:
              pass
          else:
              raise AssertionError("Proof guard accepted extra signing secrets")
          print("signing-proof.yml: extra-signing-secrets mutation rejected")
          PY
      - name: The macOS proof is manual, confines Apple secrets and verifies both binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from copy import deepcopy
          import re
          import yaml

          pins = {
              "actions/checkout": "3d3c42e5aac5ba805825da76410c181273ba90b1",
              "actions/setup-node": "949feb2413d6458794dcd2491c4babbbce0c15c1",
              "actions/setup-go": "40f1582b2485089dde7abd97c1529aa768e1baff",
              "actions/upload-artifact": "ea165f8d65b6e75b540449e92b4886f43607fa02",
              "actions/download-artifact": "9000827ccba6bdab643e8b6fd33ac0654aef8333",
              "goreleaser/goreleaser-action": "a4f02ab5355a589de60d917a659ce617ed19b3de",
          }
          secret_names = ["MACOS_SIGN_P12", "MACOS_SIGN_PASSWORD", "MACOS_NOTARY_ISSUER_ID", "MACOS_NOTARY_KEY_ID", "MACOS_NOTARY_KEY"]
          def expression(value):
              return "$" + "{{ " + value + " }}"

          def named(job, name):
              matches = [s for s in job["steps"] if s.get("name") == name]
              assert len(matches) == 1, name
              return matches[0]

          def check(proof):
              assert proof[True] == {"workflow_dispatch": None}
              assert proof["permissions"] == {"contents": "read"}
              assert proof["concurrency"] == {"group": "macos-signing-proof", "cancel-in-progress": False}
              jobs = proof["jobs"]
              assert set(jobs) == {"web", "sign", "verify"}
              assert jobs["sign"]["needs"] == "web"
              assert jobs["verify"]["needs"] == "sign"
              dumped = yaml.safe_dump(proof)
              assert "certum_" not in dumped.casefold()
              assert not re.search(r"^\s*(environment|continue-on-error):", dumped, re.M)
              assert "always()" not in dumped
              for name, job in jobs.items():
                  assert job["if"] == "github.repository == 'mateusz-klatt/iris' && github.ref == 'refs/heads/main'"
                  assert job["runs-on"] == ("macos-latest" if name == "verify" else "ubuntu-latest")
                  assert job["permissions"] == ({} if name == "verify" else {"contents": "read"})
                  for step in job["steps"]:
                      if "uses" in step:
                          action, revision = step["uses"].split("@")
                          assert revision == pins[action]
                      if step.get("uses", "").startswith("actions/checkout@"):
                          assert step["with"]["persist-credentials"] is False
                          assert step["with"]["ref"] == expression("github.sha")
                  if name != "verify":
                      assert job["outputs"] == {"artifact-id": expression("steps.upload.outputs.artifact-id")}
                      uploads = [s for s in job["steps"] if s.get("uses", "").startswith("actions/upload-artifact@")]
                      assert len(uploads) == 1
                      assert uploads[0] == job["steps"][-1]
                      assert uploads[0]["id"] == "upload"
                      assert uploads[0]["with"]["name"].endswith(expression("github.run_id") + "-" + expression("github.run_attempt"))
                      assert uploads[0]["with"]["retention-days"] == 1
                      assert uploads[0]["with"]["if-no-files-found"] == "error"
              assert jobs["web"]["steps"][1]["with"] == {"node-version": 26, "cache": "npm", "cache-dependency-path": "web/package-lock.json"}
              assert jobs["web"]["steps"][2]["run"] == "make web"
              assert jobs["web"]["steps"][-1]["with"]["path"] == "internal/webui/dist"
              sign = jobs["sign"]
              assert sign["steps"][0]["with"]["fetch-depth"] == 0
              assert sign["steps"][2]["with"] == {"go-version-file": "go.mod"}
              assert sign["steps"][3]["with"] == {"version": "v2.20.0", "install-only": True}
              signing = named(sign, "Build, sign and notarize the snapshot")
              assert signing["env"] == {**{n: expression("secrets." + n) for n in secret_names}, "WEB_DIST": expression("runner.temp") + "/webui-dist"}
              assert "set -euo pipefail" in signing["run"]
              assert "for credential in " + " ".join(secret_names) + "; do" in signing["run"]
              assert 'if [ -z "${!credential}" ]; then' in signing["run"]
              assert "exit 1" in signing["run"]
              assert signing["run"].splitlines()[-1] == 'goreleaser release --snapshot --clean --skip=docker,sbom,sign,publish 2>&1 | tee "$RUNNER_TEMP/macos-signing-proof.log"'
              outside_signing = deepcopy(proof)
              named(outside_signing["jobs"]["sign"], "Build, sign and notarize the snapshot").pop("env")
              assert "secrets" not in yaml.safe_dump(outside_signing).casefold(), "Secrets outside signing step env"
              acceptance = named(sign, "Require Apple acceptance for both binaries")["run"]
              for policy in [
                  '("iris_darwin_amd64_v1", "iris_darwin_arm64_v8.0")',
                  'binary = f"dist/{target}/iris"',
                  r'if not re.search(r"\bnotarized\s+binary=" + re.escape(binary) + r"(?:\s|$)", log):',
                  'raise SystemExit',
                  'GITHUB_STEP_SUMMARY',
              ]:
                  assert policy in acceptance, policy
              assert sign["steps"][-1]["with"]["path"].splitlines() == ["dist/iris_darwin_amd64_v1/iris", "dist/iris_darwin_arm64_v8.0/iris"]
              for name, source, path in [("sign", "web", "webui-dist"), ("verify", "sign", "macos-proof")]:
                  downloads = [s["with"] for s in jobs[name]["steps"] if s.get("uses", "").startswith("actions/download-artifact@")]
                  assert downloads == [{"artifact-ids": expression(f"needs.{source}.outputs.artifact-id"), "path": expression("runner.temp") + "/" + path}]
              verify = jobs["verify"]
              assert len(verify["steps"]) == 2
              native = named(verify, "Verify both signatures and run the arm64 binary")["run"]
              for policy in [
                  'set -euo pipefail',
                  'test "$(uname -m)" = arm64',
                  'test "$(find . -type f | LC_ALL=C sort)" = "$(printf \'%s\\n\' ./iris_darwin_amd64_v1/iris ./iris_darwin_arm64_v8.0/iris)"',
                  'for target in iris_darwin_amd64_v1 iris_darwin_arm64_v8.0; do',
                  'binary="./$target/iris"',
                  'chmod +x "$binary"',
                  'codesign --verify --strict --verbose=2 "$binary" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"',
                  'codesign -dv --verbose=4 "$binary" 2>&1 | tee "$RUNNER_TEMP/macos-signature.txt" | tee -a "$GITHUB_STEP_SUMMARY"',
                  "grep -Fx 'Authority=Developer ID Application: Mateusz Klatt (26MP7QQP95)'",
                  "grep -Fx 'TeamIdentifier=26MP7QQP95'",
                  r"grep -E '^CodeDirectory .*flags=.*\(.*runtime.*\)'",
                  "grep -E '^Timestamp=.+$'",
                  'spctl -a -vvv -t install "$binary" 2>&1 | tee "$RUNNER_TEMP/macos-assessment.txt" | tee -a "$GITHUB_STEP_SUMMARY"',
                  'grep -Fx "$binary: accepted"',
                  "grep -Fx 'source=Notarized Developer ID'",
                  './iris_darwin_arm64_v8.0/iris version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"',
              ]:
                  assert policy in native, policy

          proof = yaml.safe_load(open(".github/workflows/macos-signing-proof.yml"))
          check(proof)
          mutations = [
              ((True,), {"push": None}),
              (("permissions",), {"contents": "write"}),
              (("concurrency", "cancel-in-progress"), True),
              (("jobs", "sign", "needs"), []),
              (("jobs", "verify", "needs"), "web"),
              (("jobs", "verify", "runs-on"), "ubuntu-latest"),
              (("jobs", "sign", "continue-on-error"), True),
              (("jobs", "sign", "environment"), "signing"),
              (("jobs", "web", "steps", -1, "with", "path"), "dist/*"),
              (("jobs", "sign", "steps", -1, "with", "path"), "dist/*"),
              (("jobs", "sign", "steps", 3, "with", "version"), "latest"),
              (("jobs", "sign", "steps", 3, "with", "install-only"), False),
          ]
          for name, job in proof["jobs"].items():
              mutations += [(("jobs", name, "if"), "always()"), (("jobs", name, "permissions"), {"contents": "read", "id-token": "write"})]
              for i, step in enumerate(job["steps"]):
                  path = ("jobs", name, "steps", i)
                  if "uses" in step:
                      mutations.append((path + ("uses",), step["uses"].split("@")[0] + "@main"))
                  if step.get("uses", "").startswith("actions/checkout@"):
                      mutations.append((path + ("with", "persist-credentials"), True))
                  if step.get("uses", "").startswith("actions/download-artifact@"):
                      mutations.append((path + ("with", "artifact-ids"), "1,2"))
                  if step.get("uses", "").startswith("actions/upload-artifact@"):
                      mutations += [(path + ("with", "retention-days"), 90), (path + ("with", "name"), "proof")]
          for path, reference in [
              (("env",), "secrets.MACOS_NOTARY_KEY"),
              (("jobs", "web", "env"), "secrets.macos_sign_p12"),
              (("jobs", "sign", "env"), "toJSON(secrets)"),
              (("jobs", "verify", "env"), "secrets[format('MACOS_{0}', 'NOTARY_KEY')]"),
              (("jobs", "sign", "steps", 0, "env"), "secrets.MACOS_SIGN_PASSWORD"),
              (("jobs", "verify", "steps", 0, "env"), "toJSON(secrets)"),
          ]:
              mutations.append((path, {"LEAK": expression(reference)}))
          signing_path = ("jobs", "sign", "steps", 4)
          signing = proof["jobs"]["sign"]["steps"][4]
          mutations += [
              (signing_path + ("env", "LEAK"), expression("secrets.CERTUM_OTP")),
              (signing_path + ("env", "LEAK"), expression("secrets.GITHUB_TOKEN")),
              (signing_path + ("env", "LEAK"), expression("toJSON(secrets)")),
          ]
          for original, replacement in [("--snapshot ", ""), ("docker,sbom,sign,publish", "docker,sbom,sign,publish,notarize"), ("set -euo pipefail", "set -eu"), ('if [ -z "${!credential}" ]; then', 'if false; then')]:
              mutations.append((signing_path + ("run",), signing["run"].replace(original, replacement)))
          acceptance = proof["jobs"]["sign"]["steps"][5]["run"]
          for original in ["iris_darwin_arm64_v8.0", "notarized", "raise SystemExit"]:
              mutations.append((("jobs", "sign", "steps", 5, "run"), acceptance.replace(original, "omitted")))
          native = proof["jobs"]["verify"]["steps"][-1]["run"]
          for original in ["set -euo pipefail", 'test "$(uname -m)" = arm64', "for target in iris_darwin_amd64_v1 iris_darwin_arm64_v8.0; do", 'chmod +x "$binary"', "--strict", "codesign -dv --verbose=4", "Authority=Developer ID Application: Mateusz Klatt (26MP7QQP95)", "TeamIdentifier=26MP7QQP95", "runtime", "Timestamp", "spctl -a -vvv -t install", "$binary: accepted", "source=Notarized Developer ID", "./iris_darwin_arm64_v8.0/iris version", "GITHUB_STEP_SUMMARY"]:
              mutations.append((("jobs", "verify", "steps", -1, "run"), native.replace(original, "omitted")))
          for path, value in mutations:
              mutated = deepcopy(proof)
              target = mutated
              for key in path[:-1]:
                  target = target[key]
              target[path[-1]] = value
              try:
                  check(mutated)
              except (AssertionError, KeyError):
                  pass
              else:
                  raise AssertionError(f"macOS proof guard accepted mutation at {path}")
          print(f"macos-signing-proof.yml: real workflow passed; all {len(mutations)} mutations rejected")
          PY
      - name: Run the image as non-root on a fresh named volume
        shell: bash
        run: |
          set -euo pipefail
          docker images
          # The runner is amd64, and both platforms are loaded in no fixed order.
          image=$(docker images --format '{{.Repository}}:{{.Tag}}' ghcr.io/mateusz-klatt/iris | grep -- '-amd64$')
          test -n "$image"
          identity=$(docker run --rm "$image" version)
          echo "$identity"
          test "${identity#* (commit }" = "$GITHUB_SHA; source clean; console unverified)"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "65532:65532"
          docker volume create iris-image-check
          docker run -d --name iris-image-check -v iris-image-check:/data "$image"
          inspect() { docker run --rm -v iris-image-check:/data busybox:1.37 "$@"; }
          for _ in $(seq 1 30); do
            if inspect test -s /data/hub.token && inspect test -s /data/iris.db; then
              break
            fi
            sleep 1
          done
          docker logs iris-image-check
          test "$(docker inspect --format '{{.State.Running}}' iris-image-check)" = true
          inspect ls -ln /data
          inspect stat -c '%u:%g' /data /data/hub.token /data/iris.db | sort -u | tee owners
          test "$(cat owners)" = "65532:65532"
  deploy-image:
    # The public hub's machine compiles nothing, so CI builds what it runs. The image stamps the
    # source state it sees and a deploy takes it as the build of this commit, so it gets a job of
    # its own: a checkout no other step has touched. Only a push to main keeps the image a deploy
    # takes. A pull request keeps its image for a day under another name, so the change can be
    # rehearsed before it is merged without compiling anywhere else. docs/deploy.md has the
    # procedure and says what it does not prove.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and save the deployment image from a clean tree
        shell: bash
        run: |
          set -euo pipefail
          make image
          identity=$(docker run --rm iris-iris version)
          if test "$identity" != "dev (commit $GITHUB_SHA; source clean; console unverified)"; then
            echo "$identity"
            git status --porcelain --untracked-files=normal
            echo "::error title=Deployment image::it must name this commit and a clean source"
            exit 1
          fi
          mkdir deploy-image
          docker save iris-iris:latest | gzip -1 > deploy-image/iris-image.tar.gz
          # An image ID depends on the daemon's image store, and this runner's is not overlay2,
          # so a deploy compares the layer list. The ID is here for the record.
          {
            echo "commit=$GITHUB_SHA"
            echo "platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' iris-iris:latest)"
            echo "image_id=$(docker image inspect --format '{{.Id}}' iris-iris:latest)"
            echo "layers=$(docker image inspect --format '{{json .RootFS.Layers}}' iris-iris:latest)"
          } > deploy-image/iris-image.txt
          cat deploy-image/iris-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event_name == 'push' }}
        with:
          name: iris-image-${{ github.sha }}
          path: deploy-image/
          # gzip already compressed the image.
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      # On a pull request the checkout is the merge of its head into main, so that is what this
      # image holds and the commit it names. The name says rehearsal, and a deploy looks only
      # for iris-image-<commit> in a run of a push.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: iris-rehearsal-image-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: deploy-image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  check-all:
    # Lint, known vulnerabilities, secrets in history, and pinned actions. Run the same
    # locally with `make check-all`; each tool's version is pinned in the Makefile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # both PR endpoints and main's full history must be present
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The CI tools under .github are outside ./..., and a pattern skips dot directories,
      # so each is named.
      - run: go test -cover ./.github/covermerge ./.github/pincheck
      - run: make check-all
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all' }}
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          install-only: true
      - name: Validate stage 0 release configuration
        shell: bash
        run: |
          # v2.20 returns 2 for valid configurations using deprecated brews (D15).
          # Keep that visible, while invalid configurations (exit 1) fail CI.
          set +e
          goreleaser check
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "::warning::Valid configuration uses deprecated brews until notarization is available."
          else
            exit "$result"
          fi
      - name: Exercise the real Windows hook with a synthetic signer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import yaml

          root = Path(tempfile.mkdtemp(prefix="iris-signing-hook-", dir=os.environ["RUNNER_TEMP"]))
          suffix = ".exe" if os.name == "nt" else ""
          helper = root / ("iris-release-tools" + suffix)
          signer = root / ("synthetic-signer" + suffix)
          source = root / "signer.go"
          source.write_text('package main\nimport "os"\nfunc main() { if len(os.Args) != 2 { os.Exit(2) }; marker, err := os.OpenFile(os.Args[1]+".signed", os.O_WRONLY|os.O_CREATE|os.O_EXCL, 0600); if err != nil { os.Exit(3) }; if _, err := marker.WriteString("called once"); err != nil { os.Exit(4) }; if marker.Close() != nil { os.Exit(5) } }\n')
          subprocess.run(["go", "build", "-trimpath", "-o", str(helper), "./cmd/iris-release-tools"], check=True, env=dict(os.environ, CGO_ENABLED="0"))
          subprocess.run(["go", "build", "-trimpath", "-o", str(signer), str(source)], check=True, env=dict(os.environ, CGO_ENABLED="0"))
          hook = yaml.safe_load(Path(".goreleaser.yaml").read_text())["builds"][0]["hooks"]
          for name, snapshot, missing, succeeds in [("snapshot", True, None, True), ("missing-helper", False, "IRIS_RELEASE_HELPER", False), ("missing-credentials", False, "CERTUM_OTP", False), ("signed", False, None, True), ("repeated-hook", False, None, False)]:
              dist = root / name
              config = root / (name + ".yaml")
              target_hook = {"post": hook["post"] * 2} if name == "repeated-hook" else hook
              config.write_text(yaml.safe_dump({"version": 2, "project_name": "iris", "dist": str(dist), "builds": [{"id": "iris", "main": "./cmd/iris-release-tools", "binary": "iris", "env": ["CGO_ENABLED=0"], "goos": ["windows"], "goarch": ["amd64"], "hooks": target_hook}]}))
              env = dict(os.environ, GOOS="windows", GOARCH="amd64", GORELEASER_CURRENT_TAG="v0.0.0-signing-test", IRIS_RELEASE_HELPER=str(helper), IRIS_WINDOWS_SIGNER=str(signer), XDG_RUNTIME_DIR=str(root / "runtime"), CERTUM_EMAIL="synthetic@example.invalid", CERTUM_OTP="synthetic")
              if missing:
                  env.pop(missing)
              args = ["goreleaser", "build", "--config", str(config), "--single-target", "--skip=before,validate"]
              if snapshot:
                  args.append("--snapshot")
              result = subprocess.run(args, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              assert (result.returncode == 0) == succeeds, result.stdout
              markers = list(dist.rglob("*.signed"))
              assert len(markers) == (1 if name in ("signed", "repeated-hook") else 0), markers
              for marker in markers:
                  assert marker.read_text() == "called once", marker
              if name == "missing-helper":
                  assert "IRIS_RELEASE_HELPER" in result.stdout, result.stdout
              if name == "missing-credentials":
                  assert "release tools: signing configuration is incomplete" in result.stdout, result.stdout
              if name == "repeated-hook":
                  assert "release tools: Windows signing failed" in result.stdout, result.stdout
              print(name + ": expected hook result and signer call count")
          PY
