name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sonar:
    # The gate reads the profile each OS job uploaded, so it waits for them, and
    # still runs when one failed so the scan is not lost.
    needs: test
    # Pull requests from forks get no secrets, so the scanner could not authenticate.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: profiles
          merge-multiple: true
      - name: Merge Go coverage from every OS
        run: |
          go test ./.github/covermerge
          go run ./.github/covermerge profiles/*.out > coverage.out
      - run: npm ci --ignore-scripts --prefix web
      - name: Web coverage
        id: web_coverage
        # The 100% gate is enforced after the scan, so Sonar always gets the data.
        continue-on-error: true
        run: npm run coverage --prefix web
      - name: Copilot extension coverage
        id: extension_coverage
        # Enforced below with the console's gate, after the scan, so Sonar gets this data too.
        continue-on-error: true
        run: make copilot-extension
      # Runs that Dependabot triggers get no repository secrets, so the scanner cannot
      # authenticate and fails whatever the change. Those runs skip the analysis and say so.
      # main's own run after the merge has the token, so the gate on main still decides.
      # The coverage gate below runs either way.
      - name: Is the Sonar token available?
        id: sonar_token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error title=Sonar token missing::main's run must have SONAR_TOKEN; the analysis cannot be skipped here."
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sonar skipped::SONAR_TOKEN is not available to this run (Dependabot gets no repository secrets), so the SonarCloud analysis was skipped. main's analysis after the merge still runs."
          fi
      - name: SonarCloud Scan
        if: ${{ steps.sonar_token.outputs.present == 'true' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarCloud Quality Gate
        if: ${{ steps.sonar_token.outputs.present == 'true' }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Coverage must be 100%
        if: ${{ !cancelled() }}
        env:
          WEB_COVERAGE: ${{ steps.web_coverage.outcome }}
          EXTENSION_COVERAGE: ${{ steps.extension_coverage.outcome }}
        run: |
          test "$WEB_COVERAGE" = success
          test "$EXTENSION_COVERAGE" = success
          make cov-check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix web
      - run: npm audit --audit-level=moderate --prefix web
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go-only builds report the missing console and source state
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build ./...
          binary="$RUNNER_TEMP/iris-version.exe"
          go build -trimpath -o "$binary" ./cmd/iris
          test "$("$binary" version)" = "dev (commit $GITHUB_SHA; source clean; console missing)"
          trap 'rm -f .iris-build-identity-probe' EXIT
          echo dirty > .iris-build-identity-probe
          go build -trimpath -o "$binary" ./cmd/iris
          test "$("$binary" --version)" = "dev (commit $GITHUB_SHA; source dirty; console missing)"
          rm .iris-build-identity-probe
          go build -buildvcs=false -trimpath -o "$binary" ./cmd/iris
          test "$("$binary" version)" = "dev (commit unknown; source modified unknown; console missing)"
      - run: go vet ./...
      # Includes the package-discovery regression with a Go package under
      # node_modules; it runs on every OS without needing npm or Node.
      - run: go test -coverprofile=coverage-${{ matrix.os }}.out ./...
        # PowerShell would split the flag at the dot in its value.
        shell: bash
        env:
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.out
          retention-days: 1
      - run: go test -race -timeout=30m ./...
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
      # The sonar job's gate credits a statement covered on any system. This one holds each system
      # to its own profile, which is what `make cov-check` reports on a machine of that system.
      - name: Every statement this system builds is covered
        run: go run ./.github/covermerge -check coverage-${{ matrix.os }}.out
        shell: bash
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath ./cmd/iris
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}

  hook-latency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Measure 100 real pre-edit hooks (report only, no latency threshold)
        run: go test ./cmd/iris -run '^TestHookLatency$' -count=1 -v
        env:
          CGO_ENABLED: "0"
          IRIS_MEASURE_LATENCY: "1"
      # Fails if a shell reconcile against a hub 80 ms away runs out of its budget (D3).
      - name: Run real shell hooks against a delayed remote hub and a loopback one
        run: go test ./cmd/iris -run '^TestShellReconcileLatency$' -count=1 -v
        env:
          CGO_ENABLED: "0"
          IRIS_MEASURE_LATENCY: "1"
  release-image:
    # The image has no shell, so only a real run shows the hub can write to /data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # The release workflow builds the console in a job of its own and hands it over as
      # WEB_DIST. Build it the local way here, then give the snapshot the same hand-over,
      # so both branches of `make web` run before the first tag.
      - name: Local build rebuilds the console without source dirt
        shell: bash
        run: |
          set -euo pipefail
          make build
          test "$(./iris version)" = "dev (commit $GITHUB_SHA; source clean; console unverified)"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$RUNNER_TEMP/webui-dist"
          cp -a internal/webui/dist/. "$RUNNER_TEMP/webui-dist/"
          # Vite's output is deterministic, so mark the copy: only the copy branch of
          # `make web` can then produce what the last step compares.
          printf '\n<!-- handed over by CI -->\n' >> "$RUNNER_TEMP/webui-dist/index.html"
      # Keyless signing needs a release's OIDC identity, so only the SBOM is exercised here.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --snapshot --clean --skip=sign
        env:
          WEB_DIST: ${{ runner.temp }}/webui-dist
      - name: The snapshot embedded the handed-over console
        shell: bash
        run: |
          set -euo pipefail
          cmp internal/webui/dist/index.html "$RUNNER_TEMP/webui-dist/index.html"
          grep -q 'handed over by CI' internal/webui/dist/index.html
      - name: The snapshot made an SBOM for every archive
        shell: bash
        run: |
          set -euo pipefail
          archives=$(ls dist/*.tar.gz dist/*.zip | wc -l)
          sboms=$(ls dist/*.sbom.json | wc -l)
          echo "archives=$archives sboms=$sboms"
          test "$archives" -gt 0
          test "$archives" = "$sboms"
      - name: The release workflow confines signing and container publication
        run: go run ./cmd/iris-workflowguard release
      - name: The signing proof is manual and confines Certum secrets to sign
        run: go run ./cmd/iris-workflowguard signing-proof
      - name: The macOS proof is manual, confines Apple secrets and verifies both binaries
        run: go run ./cmd/iris-workflowguard macos-proof
      - name: Run the image as non-root on a fresh named volume
        shell: bash
        run: |
          set -euo pipefail
          docker images
          # The runner is amd64, and both platforms are loaded in no fixed order.
          image=$(docker images --format '{{.Repository}}:{{.Tag}}' ghcr.io/mateusz-klatt/iris | grep -- '-amd64$')
          test -n "$image"
          identity=$(docker run --rm "$image" version)
          echo "$identity"
          test "${identity#* (commit }" = "$GITHUB_SHA; source clean; console unverified)"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "65532:65532"
          docker volume create iris-image-check
          docker run -d --name iris-image-check -v iris-image-check:/data "$image"
          inspect() { docker run --rm -v iris-image-check:/data busybox:1.37 "$@"; }
          for _ in $(seq 1 30); do
            if inspect test -s /data/hub.token && inspect test -s /data/iris.db; then
              break
            fi
            sleep 1
          done
          docker logs iris-image-check
          test "$(docker inspect --format '{{.State.Running}}' iris-image-check)" = true
          inspect ls -ln /data
          inspect stat -c '%u:%g' /data /data/hub.token /data/iris.db | sort -u | tee owners
          test "$(cat owners)" = "65532:65532"
  deploy-image:
    # The public hub's machine compiles nothing, so CI builds what it runs. The image stamps the
    # source state it sees and a deploy takes it as the build of this commit, so it gets a job of
    # its own: a checkout no other step has touched. Only a push to main keeps the image a deploy
    # takes. A pull request keeps its image for a day under another name, so the change can be
    # rehearsed before it is merged without compiling anywhere else. docs/deploy.md has the
    # procedure and says what it does not prove.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and save the deployment image from a clean tree
        shell: bash
        run: |
          set -euo pipefail
          make image
          identity=$(docker run --rm iris-iris version)
          if test "$identity" != "dev (commit $GITHUB_SHA; source clean; console unverified)"; then
            echo "$identity"
            git status --porcelain --untracked-files=normal
            echo "::error title=Deployment image::it must name this commit and a clean source"
            exit 1
          fi
          mkdir deploy-image
          docker save iris-iris:latest | gzip -1 > deploy-image/iris-image.tar.gz
          # An image ID depends on the daemon's image store, and this runner's is not overlay2,
          # so a deploy compares the layer list. The ID is here for the record.
          {
            echo "commit=$GITHUB_SHA"
            echo "platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' iris-iris:latest)"
            echo "image_id=$(docker image inspect --format '{{.Id}}' iris-iris:latest)"
            echo "layers=$(docker image inspect --format '{{json .RootFS.Layers}}' iris-iris:latest)"
          } > deploy-image/iris-image.txt
          cat deploy-image/iris-image.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'push' }}
        with:
          name: iris-image-${{ github.sha }}
          path: deploy-image/
          # gzip already compressed the image.
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      # On a pull request the checkout is the merge of its head into main, so that is what this
      # image holds and the commit it names. The name says rehearsal, and a deploy looks only
      # for iris-image-<commit> in a run of a push.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: iris-rehearsal-image-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: deploy-image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  check-all:
    # Lint, known vulnerabilities, secrets in history, and pinned actions. Run the same
    # locally with `make check-all`; each tool's version is pinned in the Makefile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # both PR endpoints and main's full history must be present
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The CI tools under .github are outside ./..., and a pattern skips dot directories,
      # so each is named.
      - run: go test -cover ./.github/covermerge ./.github/pincheck ./.github/refresh
      - run: make check-all
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all' }}
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          install-only: true
      - name: Validate stage 0 release configuration
        shell: bash
        run: |
          # v2.20 returns 2 for valid configurations using deprecated brews (D15).
          # Keep that visible, while invalid configurations (exit 1) fail CI.
          set +e
          goreleaser check
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "::warning::Valid configuration uses deprecated brews until notarization is available."
          else
            exit "$result"
          fi
      - name: Exercise the real Windows hook with a synthetic signer
        run: go run ./cmd/iris-workflowguard windows-hook
