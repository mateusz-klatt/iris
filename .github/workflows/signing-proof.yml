name: Windows signing proof
# No environment gate exists. Certum secrets are used at repository level.
# On 2026-11-11 the owner allowed fleet sessions to dispatch this proof.
# Each run spends two signatures. It uses the stock ssign revision described
# as the interim in ADR 021.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: certum-signing, cancel-in-progress: false}
jobs:
  signer:
    if: github.repository == 'mateusz-klatt/iris' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Le-Syl21/ssign
          ref: f7ba7b2360a3e40bb8aa062d244d95c62a743b90 # v0.1.8, MIT
          path: ssign
          persist-credentials: false
      - name: Build the pinned signer without credentials
        working-directory: ssign
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --release --locked
          sha256sum target/release/ssign >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certum-signer
          path: ssign/target/release/ssign
          if-no-files-found: error
          retention-days: 1
  sign:
    if: github.repository == 'mateusz-klatt/iris' && github.ref == 'refs/heads/main'
    needs: signer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: certum-signer
          path: ${{ runner.temp }}/signer
      - name: Build the release helper
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/iris-release-tools" ./cmd/iris-release-tools
      - name: Build two disposable Windows binaries
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        # Fresh Go outputs are unsigned by construction; no separate unsigned check.
        run: |
          for arch in amd64 arm64; do
            mkdir -p "$RUNNER_TEMP/windows/$arch"
            GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/windows/$arch/iris.exe" ./cmd/iris
          done
      - name: Sign each binary once
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          IRIS_WINDOWS_SIGNER: ${{ runner.temp }}/signer/ssign
          XDG_RUNTIME_DIR: ${{ runner.temp }}/certum-signing
        # ssign caches its session under this fixed temp directory. No cleanup step:
        # the GitHub-hosted VM, including that directory, is discarded after the job.
        # Vote 7: exercise two separate helper processes. The acceptance record
        # uses this signing step's UTC start/end from the run's job-step timestamps:
        # floor(startUnix/30) == floor(endUnix/30) establishes the same window.
        # Crossing a boundary is inconclusive; there is no automatic retry.
        # The helper filters the child's environment and suppresses output.
        run: |
          "$RUNNER_TEMP/iris-release-tools" sign-windows --arch=amd64 --path="$RUNNER_TEMP/windows/amd64/iris.exe"
          "$RUNNER_TEMP/iris-release-tools" sign-windows --arch=arm64 --path="$RUNNER_TEMP/windows/arm64/iris.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-windows-proof
          path: |
            ${{ runner.temp }}/windows/amd64/iris.exe
            ${{ runner.temp }}/windows/arm64/iris.exe
          if-no-files-found: error
          retention-days: 1
  verify:
    if: github.repository == 'mateusz-klatt/iris' && github.ref == 'refs/heads/main'
    needs: sign
    runs-on: windows-latest
    permissions: {}
    env:
      # The owner's Certum open-source code-signing certificate, confirmed from run
      # 43023491609 on 2026-11-11 and valid until 2027-11-10. Change this pin when
      # the certificate is renewed.
      EXPECTED_SIGNER_THUMBPRINT: '9C837C68415187A72D88612BDF14FCB0D6623D67'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-windows-proof
          path: ${{ runner.temp }}/windows
      - name: Verify both signatures on Windows
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows'
          $expected = 'amd64/iris.exe', 'arm64/iris.exe'
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | ForEach-Object {
            [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
          })
          if ($files.Count -ne 2 -or @($files | Where-Object { $_ -cnotin $expected }).Count -ne 0) {
            throw "Signing proof artifact must contain only amd64/iris.exe and arm64/iris.exe."
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER_THUMBPRINT)) {
            foreach ($arch in 'amd64', 'arm64') {
              $signature = Get-AuthenticodeSignature -FilePath (Join-Path $root "$arch/iris.exe")
              [pscustomobject]@{
                Subject = $signature.SignerCertificate.Subject
                Issuer = $signature.SignerCertificate.Issuer
                Thumbprint = $signature.SignerCertificate.Thumbprint
                NotBefore = $signature.SignerCertificate.NotBefore
                NotAfter = $signature.SignerCertificate.NotAfter
                TimeStamperSubject = $signature.TimeStamperCertificate.Subject
              } | Format-List | Out-Host
            }
            throw "Confirm that the printed public certificate is yours, then commit its Thumbprint as EXPECTED_SIGNER_THUMBPRINT in signing-proof.yml."
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          foreach ($arch in 'amd64', 'arm64') {
            $file = Join-Path $env:RUNNER_TEMP "windows/$arch/iris.exe"
            & $signtool verify /pa /all /v /tw $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for $arch (exit $LASTEXITCODE)." }
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid' -or
                $null -eq $signature.TimeStamperCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER_THUMBPRINT) {
              throw "Authenticode verification failed for ${arch}: expected a valid, timestamped signature from the committed certificate."
            }
          }
