name: macOS signing proof
# A snapshot submits two binaries to Apple, without a tag or release publication.
# This is separate from release.yml and does not satisfy the Homebrew upload gate.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: macos-signing-proof, cancel-in-progress: false}
jobs:
  # Build the console without signing credentials, as in release.yml.
  web:
    if: github.repository == 'mateusz-klatt/iris' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: macos-proof-webui-${{ github.run_id }}-${{ github.run_attempt }}
          path: internal/webui/dist
          if-no-files-found: error
          retention-days: 1
  sign:
    if: github.repository == 'mateusz-klatt/iris' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.artifact-id }}
          path: ${{ runner.temp }}/webui-dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          install-only: true
      - name: Build, sign and notarize the snapshot
        shell: bash
        env:
          WEB_DIST: ${{ runner.temp }}/webui-dist
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          for credential in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!credential}" ]; then
              echo "::error::$credential is empty"
              exit 1
            fi
          done
          # v2.20.0: sign skips cosign, not the separate notarize.macos stage.
          # Snapshots skip publication too; the Windows signing hook renders empty.
          goreleaser release --snapshot --clean --skip=docker,sbom,sign,publish 2>&1 | tee "$RUNNER_TEMP/macos-signing-proof.log"
      - name: Require Apple acceptance for both binaries
        shell: bash
        # v2.20.0 records acceptance only in the log, not artifacts.json.
        # Timeout/pending can otherwise leave GoReleaser successful.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          log = Path(os.environ["RUNNER_TEMP"], "macos-signing-proof.log").read_text()
          log = re.sub(r"\x1b\[[0-9;]*m", "", log)
          for target in ("iris_darwin_amd64_v1", "iris_darwin_arm64_v8.0"):
              binary = f"dist/{target}/iris"
              if not re.search(r"\bnotarized\s+binary=" + re.escape(binary) + r"(?:\s|$)", log):
                  raise SystemExit(f"Missing Apple notarization acceptance for {binary}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"Apple accepted notarization: `{binary}`\n\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: macos-signing-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/iris_darwin_amd64_v1/iris
            dist/iris_darwin_arm64_v8.0/iris
          if-no-files-found: error
          retention-days: 1
  verify:
    if: github.repository == 'mateusz-klatt/iris' && github.ref == 'refs/heads/main'
    needs: sign
    runs-on: macos-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: ${{ runner.temp }}/macos-proof
      - name: Verify both signatures and run the arm64 binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cd "$RUNNER_TEMP/macos-proof"
          # Artifact ZIPs reset modes to 0644. Restore execution without changing bytes.
          test "$(find . -type f | LC_ALL=C sort)" = "$(printf '%s\n' ./iris_darwin_amd64_v1/iris ./iris_darwin_arm64_v8.0/iris)"
          for target in iris_darwin_amd64_v1 iris_darwin_arm64_v8.0; do
            binary="./$target/iris"
            chmod +x "$binary"
            printf '\n### %s\n\n```text\n' "$target" >> "$GITHUB_STEP_SUMMARY"
            codesign --verify --strict --verbose=2 "$binary" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            codesign -dv --verbose=4 "$binary" 2>&1 | tee "$RUNNER_TEMP/macos-signature.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -Fx 'Authority=Developer ID Application: Mateusz Klatt (26MP7QQP95)' "$RUNNER_TEMP/macos-signature.txt"
            grep -Fx 'TeamIdentifier=26MP7QQP95' "$RUNNER_TEMP/macos-signature.txt"
            grep -E '^CodeDirectory .*flags=.*\(.*runtime.*\)' "$RUNNER_TEMP/macos-signature.txt"
            grep -E '^Timestamp=.+$' "$RUNNER_TEMP/macos-signature.txt"
            spctl -a -vvv -t install "$binary" 2>&1 | tee "$RUNNER_TEMP/macos-assessment.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -Fx "$binary: accepted" "$RUNNER_TEMP/macos-assessment.txt"
            grep -Fx 'source=Notarized Developer ID' "$RUNNER_TEMP/macos-assessment.txt"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          done
          printf '\n### arm64 execution\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          ./iris_darwin_arm64_v8.0/iris version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
