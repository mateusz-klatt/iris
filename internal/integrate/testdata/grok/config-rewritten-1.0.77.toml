disabled_mcp_servers = ["grok"]

[cli]
installer = "internal"
auto_update = true

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[models]
default = "grok-4.6"
default_reasoning_effort = "xhigh"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.6"
yolo = false
compact_mode = false
permission_mode = "always-approve"

[mcp_servers.claude]
command = "node"
args = ["/home/user/.claude/plugins/marketplaces/delegator/server/claude/index.js"]
enabled = true

[mcp_servers.usage]
command = "node"
args = ["/home/user/.claude/plugins/marketplaces/delegator/server/usage/index.js"]
enabled = true

[mcp_servers.iris]
command = "IRIS_COMMAND"
args = [
    "mcp",
    "--client",
    "grok",
]
enabled = true
