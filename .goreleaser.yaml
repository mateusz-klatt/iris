version: 2
project_name: iris
# D15 stage 1 is prepared. Snapshots never release. A pushed version tag runs
# .github/workflows/release.yml, which makes a draft for the owner to publish.
release:
  draft: true
before:
  hooks:
    - make web
builds:
  - id: iris
    main: ./cmd/iris
    binary: iris
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - id: iris
    ids: [iris]
    name_template: 'iris_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, docs/guard.md]
# D15, prepared and inert. Without MACOS_SIGN_P12 this step is skipped and the darwin
# binaries ship as Go builds them: amd64 unsigned, arm64 ad-hoc signed by the linker.
# With the certificate alone they would be signed, and with the notary key too, notarized.
# Neither has run with a real Apple credential. docs/release.md records what was measured.
# docs/release.md names the secrets and the owner's steps.
notarize:
  macos:
    - ids: [iris]
      enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ envOrDefault "MACOS_SIGN_PASSWORD" "" }}'
      notarize:
        issuer_id: '{{ envOrDefault "MACOS_NOTARY_ISSUER_ID" "" }}'
        key_id: '{{ envOrDefault "MACOS_NOTARY_KEY_ID" "" }}'
        key: '{{ envOrDefault "MACOS_NOTARY_KEY" "" }}'
        wait: true
        timeout: 20m
checksum:
  name_template: checksums.txt
nfpms:
  - id: iris
    ids: [iris]
    package_name: iris
    file_name_template: '{{ .ConventionalFileName }}'
    vendor: Mateusz Klatt
    homepage: https://github.com/mateusz-klatt/iris
    maintainer: Mateusz Klatt
    description: Cooperative coordination for coding agents
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
dockers_v2:
  - id: iris-server
    # Stage 0 can build local snapshot images, never push a release image.
    disable: '{{ not .IsSnapshot }}'
    ids: [iris]
    images: [ghcr.io/mateusz-klatt/iris]
    tags: ['{{ .Version }}']
    platforms: [linux/amd64, linux/arm64]
    dockerfile: Dockerfile
sboms:
  - artifacts: archive
    cmd: syft
signs:
  - artifacts: checksum
    cmd: cosign
    signature: '${artifact}.sigstore.json'
    args: [sign-blob, '--bundle=${signature}', '${artifact}', '--yes']
# Deprecated in GoReleaser v2.20; homebrew_casks replaces it. Measured on macOS 26: a
# cask install sets com.apple.quarantine and Gatekeeper then blocks the unsigned binary,
# while a formula sets none. Replace this with homebrew_casks in the change that turns
# notarization on. docs/release.md has the measured cask block.
brews:
  - name: iris
    repository: {owner: mateusz-klatt, name: homebrew-tap}
    homepage: https://github.com/mateusz-klatt/iris
    description: Cooperative coordination for coding agents
    license: Apache-2.0
    skip_upload: true
    url_template: 'https://github.com/mateusz-klatt/iris/releases/download/{{ .Tag }}/{{ .ArtifactName }}'
scoops:
  - name: iris
    repository: {owner: mateusz-klatt, name: scoop-bucket}
    homepage: https://github.com/mateusz-klatt/iris
    description: Cooperative coordination for coding agents
    license: Apache-2.0
    skip_upload: true
    url_template: 'https://github.com/mateusz-klatt/iris/releases/download/{{ .Tag }}/{{ .ArtifactName }}'
winget:
  - name: iris
    publisher: Mateusz Klatt
    package_identifier: MateuszKlatt.Iris
    short_description: Cooperative coordination for coding agents
    license: Apache-2.0
    repository: {owner: mateusz-klatt, name: winget-pkgs}
    skip_upload: true
    url_template: 'https://github.com/mateusz-klatt/iris/releases/download/{{ .Tag }}/{{ .ArtifactName }}'
