name: iris
services:
  iris:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: iris
    network_mode: host
    restart: unless-stopped
    # The hub shares its machine. This is a relative weight under contention, not a cap: half the
    # default 1024, and with no competition for the CPU the hub can still use all of it.
    cpu_shares: 512
    # Docker keeps json-file logs without limit by default.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - iris-data:/data
    command:
      - serve
      - --listen
      - 127.0.0.1:7878
      - --db
      - /data/iris.db
      - --token-file
      - /data/hub.token
      - --public-url
      - https://iris.klatt.ie

volumes:
  iris-data:
