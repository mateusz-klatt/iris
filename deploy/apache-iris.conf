# Apache >= 2.4.47; modules: ssl, headers, rewrite, proxy, proxy_http.
# ACME webroot: /var/www/letsencrypt (must exist and be readable by Apache).
<VirtualHost *:80>
    ServerName iris.klatt.ie
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://iris.klatt.ie%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName iris.klatt.ie
    DocumentRoot /var/www/letsencrypt
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/iris.klatt.ie/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/iris.klatt.ie/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/letsencrypt>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Server
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Forwarded-Protocol
    RequestHeader unset X-Forwarded-Ssl
    RequestHeader unset X-Forwarded-Prefix
    RequestHeader unset X-Forwarded-Uri
    RequestHeader unset X-Forwarded-Path
    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=31536000"
    Header onsuccess unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"

    # Exclusion and specific upgrade routes must precede the catch-all.
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass /v1/ui/watch http://127.0.0.1:7878/v1/ui/watch upgrade=websocket timeout=3600 connectiontimeout=5
    ProxyPass /v1/watch http://127.0.0.1:7878/v1/watch upgrade=websocket timeout=3600 connectiontimeout=5
    ProxyPass / http://127.0.0.1:7878/ timeout=60 connectiontimeout=5
    ProxyPassReverse / http://127.0.0.1:7878/

    # Deliberately omit query strings: login codes must not enter access logs.
    LogFormat "%a %t \"%m %U %H\" %>s %b" iris_safe
    CustomLog /var/log/apache2/iris-access.log iris_safe
    ErrorLog /var/log/apache2/iris-error.log
</VirtualHost>
