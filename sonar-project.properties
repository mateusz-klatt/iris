sonar.projectKey=mateusz-klatt_iris
sonar.organization=mateusz-klatt

# Analyse every checked-out file. Test inclusions below classify tests without
# narrowing the source surface.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**,web/e2e/**

# Captured client payloads are evidence, not code. Build output is generated.
sonar.exclusions=internal/hook/testdata/**,internal/webui/dist/**,web/dist/**,web/coverage/**,web/public/**,docs/research/**

# Each locale repeats the same keys by design.
sonar.cpd.exclusions=web/src/locales/**

sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
