sonar.projectKey=mateusz-klatt_iris
sonar.organization=mateusz-klatt

# Analyse every checked-out file. Test inclusions below classify tests without
# narrowing the source surface.
sonar.sources=.
sonar.tests=.
# .github/covermerge, .github/pincheck, .github/refresh and .github/oldhub are tooling that ships in no
# binary; each is named, with no .github/** wildcard. The Copilot extension's tests are Node tests.
sonar.test.inclusions=**/*_test.go,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**,web/e2e/**,internal/integrate/testdata/**,internal/integrate/copilotextension/*.test.mjs,.github/covermerge/**,.github/pincheck/**,.github/refresh/**,.github/oldhub/**

# Captured client payloads are evidence, not code. Build output is generated.
sonar.exclusions=internal/hook/testdata/**,internal/webui/dist/**,web/dist/**,web/coverage/**,web/public/**,docs/research/**

# Each locale repeats the same keys by design.
sonar.cpd.exclusions=web/src/locales/**

sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,copilot-extension.lcov

# extension.mjs runs only inside Copilot CLI's extension host, where the SDK it imports resolves.
# It holds one call into watcher.mjs, whose logic and shutdown wiring the Node tests cover.
sonar.coverage.exclusions=internal/integrate/copilotextension/extension.mjs
